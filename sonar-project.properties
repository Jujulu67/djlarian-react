# SonarCloud (https://sonarcloud.io) : tableau de bord de la dette (bugs probables, duplication,
# complexité, failles). Analyse automatique de SonarCloud (réglages : .sonarcloud.properties) ;
# ce fichier sert à l'analyse par la CI, qui tourne quand le secret SONAR_TOKEN est défini
# (désactiver alors « Automatic Analysis » dans SonarCloud).
sonar.organization=jujulu67-github
sonar.projectKey=Jujulu67_djlarian-react
sonar.projectName=djlarian-react

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/__tests__/**,**/__mocks__/**,**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

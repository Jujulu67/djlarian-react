# Réglages de l'analyse automatique de SonarCloud (elle ignore sonar-project.properties).
# Même périmètre que l'analyse par la CI : le code de src/, hors tests.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/__tests__/**,**/__mocks__/**,**/*.test.ts,**/*.test.tsx
sonar.sourceEncoding=UTF-8

name: Test Assistant Router (Must Pass)

on:
  pull_request:
    branches: ['*']
  push:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test-assistant-router:
    name: Test Assistant Router
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for skipped tests (no .skip/.only allowed)
        run: pnpm run test:no-skips

      - name: Test Assistant Router (must pass)
        run: pnpm run test:assistant-router

      - name: Test Assistant Identity (must pass - canary test)
        run: pnpm run test:assistant-identity

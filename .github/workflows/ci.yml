name: CI (build + tests)

on:
  pull_request:
    branches: ['*']
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Valeurs factices : le build ne doit pas dépendre d'une vraie base ni de secrets
env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  NEXTAUTH_SECRET: ci-secret
  NEXTAUTH_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # Les trois jobs tournent en parallèle. Sur `main`, la fusion d'une PR déjà validée ne
  # relance ni les vérifications ni les tests ; seul le build tourne, pour alimenter le cache
  # Next.js que les PR suivantes réutilisent (GitHub ne partage entre PR que le cache de main).
  checks:
    name: Type-check et lint
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request #')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Security audit (prod)
        run: pnpm audit --prod --audit-level high
      - name: Type-check
        run: pnpm type-check
      - name: Lint
        run: pnpm lint

  tests:
    name: Tests
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request #')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Les runners GitHub ont 4 cœurs : on les utilise tous (test:ci est limité à 2)
      - name: Tests
        run: pnpm exec jest --ci --coverage --maxWorkers=100%

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Cache incrémental de Next.js : seules les pages modifiées sont recompilées
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.{ts,tsx,css}') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build
        run: NODE_OPTIONS='--import tsx' pnpm exec next build

  # Fusionne automatiquement les PR Dependabot de sécurité (patch/minor) une fois la CI verte.
  # Les mises à jour majeures et les mises à jour non liées à une faille restent en attente de revue.
  dependabot-automerge:
    name: Auto-merge Dependabot (sécurité)
    needs: [checks, tests, build]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge security update
        if: steps.metadata.outputs.dependency-group == 'security'
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

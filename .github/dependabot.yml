version: 2
updates:
  # Dépendances npm/pnpm : les mises à jour de sécurité arrivent dès qu'une faille est publiée
  # (indépendamment du planning), les autres sont regroupées une fois par semaine.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Paris'
    open-pull-requests-limit: 10
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
      minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
    # Pas de PR hebdo pour les versions majeures (bruit) : les correctifs de sécurité,
    # même majeurs, restent proposés car ils ne passent pas par ces règles.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    labels: ['dependencies']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      actions:
        patterns: ['*']
    labels: ['dependencies']
    commit-message:
      prefix: 'chore(ci)'

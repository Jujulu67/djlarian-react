version: 2
updates:
  # Dépendances npm/pnpm : uniquement les mises à jour de sécurité, dès qu'une faille est publiée.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Paris'
    # 0 = aucune PR de mise à jour « de confort » ; les correctifs de sécurité
    # ne sont pas concernés par cette limite et restent tous proposés.
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
    labels: ['dependencies']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      actions:
        patterns: ['*']
    labels: ['dependencies']
    commit-message:
      prefix: 'chore(ci)'
